name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Electron binary is not needed for formatting, linting and tests.
      - run: npm ci --ignore-scripts

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
