name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # softprops/action-gh-release publishes the assets below. electron-builder
      # would otherwise try to publish by itself because it detects the git tag
      # and the GitHub remote, then fail without a GH_TOKEN.
      - run: npm run build:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
          draft: true
