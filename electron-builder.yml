appId: com.aeternoxx.multiview
productName: MultiView
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{vitest.config.mts,package-lock.json}'
asarUnpack:
  - resources/**
win:
  executableName: MultiView
  icon: build/icon.ico
  target:
    - nsis
    - portable
    - zip
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-${version}-portable.${ext}
# The `zip` target has no config section of its own: electron-builder names it
# MultiView-<version>-win.zip and archives win-unpacked as-is.
mac:
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.video
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Aeternoxx
  category: AudioVideo
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
